
name: Generate Sitemap Automatically

on:
  push:
    branches:
      - main  # Agar aapki branch ka naam 'master' hai toh yahan master likhein

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate Sitemap
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://yourdomain.com/   # Yahan apni actual website ka link dalein

      - name: Commit and Push Sitemap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated sitemap generation"
          file_pattern: 'sitemap.xml'
          
